[project]
name = "himawari-gbr"
version = "0.1.0"
description = "Efficient access to Himawari-9 AHI L2 cloud products for the Great Barrier Reef"
requires-python = ">=3.11"
dependencies = [
    "dask>=2024.1.0",
    "fastparquet>=2024.2.0",
    "fsspec>=2024.2.0",
    "h5netcdf>=1.3.0",
    "h5py>=3.10.0",
    "kerchunk>=0.2.7",
    "pyproj>=3.6.0",
    "pyresample>=1.28.0",
    "s3fs>=2024.2.0",
    "shapely>=2.0.0",
    "ujson>=5.9.0",
    "virtualizarr>=1.0.0",
    "xarray>=2024.1.0",
    "zarr>=2.17.0,<3.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["himawari_gbr"]
